
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KORVA</title>
  <link rel="shortcut icon" href="/images/KORVA.png" type="image/x-icon">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>

<!-- NAV -->
<header>
  <div class="logo">KORVA</div>
  <nav>
    <a href="#">Home</a>
    <a href="#">Shop</a>
    <a href="#">Cart (<span id="cart-count">0</span>)</a>
  </nav>
</header>

<!-- HERO -->
<section class="hero" id="hero">
  <button class="hero-arrow left">&#10094;</button>
  <div class="hero-content">
    <h1>HOME PAGE</h1>
    <button>Shop Collection</button>
  </div>
  <button class="hero-arrow right">&#10095;</button>
</section>

<!-- PRODUCTS -->
<section class="products">
  <div class="grid" id="product-grid"></div>
</section>

<footer>
  © 2025 KORVA. All rights reserved.
</footer>

<script>
/* ---------------- HERO SLIDER ---------------- */
const hero = document.getElementById("hero");
const images = [
  "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab",
  "https://images.unsplash.com/photo-1503342217505-b0a15ec3261c",
  "https://images.unsplash.com/photo-1512436991641-6745cdb1723f"
];
let heroIndex = 0;

function updateHero() {
  hero.style.backgroundImage = `url(${images[heroIndex]})`;
}
updateHero();

document.querySelector(".right").onclick = () => {
  heroIndex = (heroIndex + 1) % images.length;
  updateHero();
};
document.querySelector(".left").onclick = () => {
  heroIndex = (heroIndex - 1 + images.length) % images.length;
  updateHero();
};
setInterval(() => {
  heroIndex = (heroIndex + 1) % images.length;
  updateHero();
}, 5000);

/* ---------------- PRODUCTS DATA ---------------- */
const products = [
  { id: 1, name: "Phone Holder Saki", price: 29.9, category: "Other", img: "https://i.imgur.com/F8YVJYw.png" },
  { id: 2, name: "Headset", price: 12.0, category: "Music", img: "https://i.imgur.com/8Q2QZ4n.png" },
  { id: 3, name: "Adudu Cleaner", price: 29.9, category: "Other", img: "https://i.imgur.com/Qm6P8wK.png" }
];

/* ---------------- RENDER PRODUCTS ---------------- */
const grid = document.getElementById("product-grid");

products.forEach(p => {
  grid.innerHTML += `
    <div class="card">
      <span class="tag">${p.category}</span>
      <img src="${p.img}">
      <h3>${p.name}</h3>
      <div class="price">$${p.price}</div>
      <div class="actions">
        <button class="cart-btn" onclick="addToCart(${p.id})">Add to Cart</button>
        <button class="buy-btn">Buy Now</button>
      </div>
    </div>
  `;
});

/* ---------------- CART ---------------- */
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function addToCart(id) {
  const item = products.find(p => p.id === id);
  cart.push(item);
  localStorage.setItem("cart", JSON.stringify(cart));
  document.getElementById("cart-count").innerText = cart.length;
  alert("Added to cart 🛒");
}

document.getElementById("cart-count").innerText = cart.length;
</script>

</body>
</html>
